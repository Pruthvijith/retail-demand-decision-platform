[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-demand-decision-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Warehouse-backed retail forecasting and inventory decision reference platform"
dependencies = ["numpy==2.3.5", "scikit-learn==1.8.0", "joblib==1.6.0"]

[project.optional-dependencies]
dev = ["pyflakes==3.4.0"]

[project.scripts]
retail-run = "retail_decisions.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

